version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fashionstore_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fashionstore_ar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fashionstore_ar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: fashionstore_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@db:5432/fashionstore_ar
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Define JWT_SECRET_KEY in .env}
      - REPORT_AI_URL=${REPORT_AI_URL:-}
      - REPORT_AI_MODEL=${REPORT_AI_MODEL:-}
      - REPORT_AI_KEY=${REPORT_AI_KEY:-}
    volumes:
      - uploads_data:/code/uploads
    depends_on:
      db:
        condition: service_healthy
    # Bootstrap aditivo: no ejecuta los seeds demostrativos que cambian datos.
    command: >
      bash -c "python -m scripts.bootstrap && 
               uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  uploads_data:
